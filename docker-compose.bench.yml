# ARTEX の Tencent TSec Benchmark 評価用イメージ —— ローカルでワンクリック build + run。
# 本番用の docker-compose.yml（複数サービス: artex+postgres）とは互いに影響しない。
# 使い方：
#   cp bench/.env.example bench/.env   # LLM_API_KEY / BENCHMARK_TOKEN などを記入
#   docker compose -f docker-compose.bench.yml up --build      # ビルドしてフォアグラウンドで実行（ログを見る）
#   docker compose -f docker-compose.bench.yml up --build -d   # バックグラウンド
#   docker compose -f docker-compose.bench.yml logs -f
#   docker compose -f docker-compose.bench.yml down            # 停止（-v を付けるとデータボリュームも削除）
# ブラウザ：http://localhost:8787（ADMIN_PASSWORD でログイン）

services:
  artex-bench:
    build:
      context: .
      dockerfile: Dockerfile.bench
    image: artex-bench:latest
    container_name: artex-bench
    env_file:
      - bench/.env
    # 物理マシンとネットワークを共有：コンテナはホストのネットワークスタックを直接使い、ホスト/VPN 上の標的ネットワークに直接つながる。
    # host モードでは ports のマッピングは使わず、コンテナがホストのポートに直接バインドする：8787（UI/API）、8788（プロキシ）、
    # および内部の PostgreSQL 5432 —— ホストのこの3ポートが空いていることを確認すること（ローカルで試す前に、それらを使うサービスを止めておく）。
    network_mode: host
    restart: "no"

volumes:
  artex_bench_data:
